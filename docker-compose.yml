name: katman

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: katman
      POSTGRES_PASSWORD: katman
      POSTGRES_DB: katman
    ports:
      - "5433:5432"
    volumes:
      - katman_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katman -d katman"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  katman_pg:
